<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planrapiku Portal</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F2EFE9; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="app" title="Planrapiku Portal"></iframe>

  <script>
    var EXEC_URL = 'https://script.google.com/macros/s/AKfycbw0XqLE7XCgZfAjUFpfzSsvlyOI_KO0tiD0pSVMPSB-p7faizRmY0DgNpFXmmQlTW2Ikg/exec';
    var ALLOWED = ['catalog', 'product', 'login', 'member', 'admin'];
    var frame = document.getElementById('app');

    function load(params) {
      var u = new URL(EXEC_URL);
      params.forEach(function (v, k) { u.searchParams.set(k, v); });
      frame.src = u.toString();
    }

    // Buka langsung dengan ?page=... atau ?page=product&slug=...
    load(new URLSearchParams(location.search));

    // Tombol back/forward browser
    window.addEventListener('popstate', function () {
      load(new URLSearchParams(location.search));
    });

    // Pesan navigasi dari Index.html
    window.addEventListener('message', function (e) {
      var host = '';
      try { host = new URL(e.origin).hostname; } catch (err) { return; }
      if (!/\.googleusercontent\.com$/.test(host)) return;
      if (!e.data || e.data.type !== 'navigate') return;

      var p = new URLSearchParams();
      if (ALLOWED.indexOf(e.data.page) !== -1) p.set('page', e.data.page);
      if (e.data.slug) p.set('slug', String(e.data.slug).slice(0, 120));

      history.pushState(null, '', '?' + p.toString());
      load(p);
    });
  </script>
</body>
</html>
