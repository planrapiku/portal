<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planrapiku Portal</title>

  <!-- PWA MANIFEST -->
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- THEME COLOR -->
  <meta name="theme-color" content="#2E2B28">

  <!-- ANDROID APP SUPPORT -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- APP ICON -->
  <link rel="icon"
        type="image/png"
        href="./icons/icon-192.png">

  <!-- APPLE SUPPORT -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Planrapiku">

  <link rel="apple-touch-icon"
        href="./icons/icon-192.png">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F2EFE9;
      font-family: Arial, sans-serif;
    }

    /* IFRAME */
    #portalFrame {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #F2EFE9;
    }

    /* WRAPPER PRODUCT FALLBACK */
    #wrapperProductFallback {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 900;
      overflow-y: auto;
      background: #F2EFE9;
      color: #2E2B28;
    }

    #wrapperProductFallback.active {
      display: block;
    }

    .wpf-topbar {
      height: 54px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2E2B28;
      color: #F2EFE9;
    }

    .wpf-back {
      border: 0;
      background: transparent;
      color: #D4A853;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .wpf-body {
      max-width: 720px;
      margin: 36px auto;
      padding: 0 16px;
    }

    .wpf-card {
      padding: 32px 24px;
      border-radius: 16px;
      background: #FCFBF9;
      border: 1px solid rgba(46, 43, 40, .12);
    }

    .wpf-badge {
      margin: 0 0 10px;
      color: #9A7837;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .wpf-title {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
    }

    .wpf-desc {
      margin: 0 0 24px;
      color: #6F6A63;
      font-size: 15px;
      line-height: 1.7;
    }

    .wpf-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .wpf-btn-gold,
    .wpf-btn-dark {
      min-height: 42px;
      padding: 0 18px;
      border-radius: 10px;
      border: 0;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .wpf-btn-gold {
      background: #9A7837;
      color: #FCFBF9;
    }

    .wpf-btn-dark {
      background: #2E2B28;
      color: #F2EFE9;
    }

    /* LOADING SCREEN */
    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2E2B28;
      opacity: 1;
      visibility: visible;
      transition:
        opacity .45s ease,
        visibility .45s ease;
    }

    #loadingScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-content {
      width: min(340px, 85%);
      text-align: center;
      color: #F2EFE9;
      animation: contentAppear .7s ease both;
    }

    /* BRAND LOGO */
    .loading-logo {
      width: 62px;
      height: 62px;
      margin: 0 auto 22px;
      border: 1px solid #D4A853;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #D4A853;
      font-size: 31px;
      font-weight: 800;
      letter-spacing: -2px;
      animation: logoPulse 2s ease-in-out infinite;
    }

    .loading-brand {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -.7px;
      margin-bottom: 7px;
    }

    .loading-subtitle {
      color: #A9A39A;
      font-size: 10px;
      letter-spacing: 3px;
      font-weight: 600;
    }

    /* LOADING LINE */
    .loading-progress {
      width: 190px;
      height: 3px;
      margin: 35px auto 20px;
      border-radius: 10px;
      overflow: hidden;
      background: #514B42;
    }

    .loading-progress-bar {
      width: 40%;
      height: 100%;
      border-radius: 10px;
      background: #D4A853;
      animation: loadingMove 1.35s ease-in-out infinite;
    }

    .loading-message {
      color: #D4A853;
      font-size: 12px;
      letter-spacing: .2px;
      min-height: 18px;
    }

    .loading-caption {
      color: #817D76;
      font-size: 10px;
      margin-top: 48px;
      letter-spacing: .3px;
    }

    /* ANIMATIONS */
    @keyframes loadingMove {
      0% {
        transform: translateX(-110%);
      }
      100% {
        transform: translateX(360%);
      }
    }

    @keyframes logoPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(212,168,83,0);
      }
      50% {
        box-shadow: 0 0 22px 2px rgba(212,168,83,.13);
      }
    }

    @keyframes contentAppear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }

    /* =================================
       PLANRAPIKU INSTALL BUTTON
    ================================= */

    #installAppButton {
      position: fixed;
      right: 20px;
      bottom: 24px;
      z-index: 10001;

      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;

      padding: 14px 20px;
      border: 1px solid #D4A853;
      border-radius: 14px;

      background: #2E2B28;
      color: #F2EFE9;

      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;

      box-shadow: 0 5px 20px rgba(0,0,0,.2);
      cursor: pointer;

      transition:
        transform .2s ease,
        background .2s ease;
    }

    #installAppButton.visible {
      display: flex;
    }

    #installAppButton:active {
      transform: scale(.96);
    }

    #installAppButton .install-icon {
      color: #D4A853;
      font-size: 19px;
    }

    @media (max-width: 480px) {
      #installAppButton {
        right: 16px;
        bottom: 20px;
        padding: 13px 17px;
        font-size: 13px;
      }
    }

    /* PRODUCT VIEWER */

    #productView {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #F2EFE9;
    }

    #productView.active {
      display: flex;
      flex-direction: column;
    }

    #productHeader {
      height: 54px;
      min-height: 54px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2E2B28;
      color: #F2EFE9;
    }

    #backToPortal {
      border: 0;
      background: transparent;
      color: #D4A853;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    #productTitle {
      font-size: 13px;
      font-weight: 600;
    }

    #productFrame {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: 0;
      background: #F2EFE9;
    }
  </style>
</head>

<body>

  <!-- PORTAL IFRAME -->
  <iframe
    id="portalFrame"
    title="Planrapiku Portal"
    allow="clipboard-read; clipboard-write">
  </iframe>

  <!-- WRAPPER PRODUCT FALLBACK -->
  <div id="wrapperProductFallback">
    <div class="wpf-topbar">
      <button id="wpfBackBtn" class="wpf-back" type="button">← Katalog</button>
      <div id="wpfHeaderTitle" style="font-size:13px;font-weight:600;">Modul Planrapiku</div>
    </div>
    <div class="wpf-body">
      <div class="wpf-card">
        <p class="wpf-badge">PLANRAPIKU MODUL</p>
        <h1 id="wpfTitle" class="wpf-title">Daily Execution</h1>
        <p id="wpfDesc" class="wpf-desc">
          Halaman detail modul sedang disiapkan atau dibuka melalui portal Planrapiku.
        </p>
        <div class="wpf-actions">
          <button id="wpfLoginBtn" class="wpf-btn-gold" type="button">Login / Cek Akses</button>
          <button id="wpfCatalogBtn" class="wpf-btn-dark" type="button">Kembali ke Katalog</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PRODUCT VIEWER -->
  <div id="productView">

    <div id="productHeader">

      <button id="backToPortal" type="button">
        ← Kembali
      </button>

      <div id="productTitle">
        Life Audit
      </div>

    </div>

    <iframe
      id="productFrame"
      title="Planrapiku Product"
      allow="clipboard-read; clipboard-write">
    </iframe>

  </div>

  <!-- LOADING SCREEN -->
  <div id="loadingScreen">

    <div class="loading-content">

      <div class="loading-logo">P</div>

      <div class="loading-brand">
        Planrapiku
      </div>

      <div class="loading-subtitle">
        PERSONAL LIFE SYSTEM
      </div>

      <div class="loading-progress">
        <div class="loading-progress-bar"></div>
      </div>

      <div class="loading-message" id="loadingMessage">
        Menyiapkan portal...
      </div>

      <div class="loading-caption">
        Rapi bukan bakat, tapi kebiasaan.
      </div>

    </div>

  </div>

  <!-- PWA INSTALL BUTTON -->
  <button id="installAppButton" type="button">
    <span class="install-icon">↓</span>
    <span>Install Planrapiku</span>
  </button>

  <script>
    const EXEC_URL =
      'https://script.google.com/macros/s/AKfycbw0XqLE7XCgZfAjUFpfzSsvlyOI_KO0tiD0pSVMPSB-p7faizRmY0DgNpFXmmQlTW2Ikg/exec';

    const ALLOWED_PAGES = [
      'catalog',
      'product',
      'login',
      'member',
      'admin',
      'app'
    ];

    const ACTIVE_APP_STORAGE_KEY = 'planrapiku_active_app';

    const frame = document.getElementById('portalFrame');
    const loadingScreen = document.getElementById('loadingScreen');
    const loadingMessage = document.getElementById('loadingMessage');

    const wpfEl = document.getElementById('wrapperProductFallback');
    const wpfBackBtn = document.getElementById('wpfBackBtn');
    const wpfHeaderTitle = document.getElementById('wpfHeaderTitle');
    const wpfTitle = document.getElementById('wpfTitle');
    const wpfDesc = document.getElementById('wpfDesc');
    const wpfLoginBtn = document.getElementById('wpfLoginBtn');
    const wpfCatalogBtn = document.getElementById('wpfCatalogBtn');

    const productView = document.getElementById('productView');
    const productFrame = document.getElementById('productFrame');
    const productTitle = document.getElementById('productTitle');
    const backToPortal = document.getElementById('backToPortal');

    let activeAppUrl = '';
    let loadingTimer = null;
    let loadingStartedAt = 0;

    function isValidPlanrapikuAppUrl(rawUrl) {
      if (!rawUrl) return '';
      try {
        const parsed = new URL(String(rawUrl).trim());
        if (
          parsed.protocol !== 'https:' ||
          !/^planrapiku-[a-z0-9-]+\.ai\.studio$/i.test(parsed.hostname)
        ) {
          return '';
        }
        return parsed.href;
      } catch (error) {
        return '';
      }
    }

    function saveActiveApp(slug, href) {
      const validHref = isValidPlanrapikuAppUrl(href);
      if (!validHref) return;
      try {
        sessionStorage.setItem(
          ACTIVE_APP_STORAGE_KEY,
          JSON.stringify({
            slug: String(slug || '').trim(),
            url: validHref
          })
        );
      } catch (error) {}
    }

    function readActiveApp(expectedSlug) {
      try {
        const raw = sessionStorage.getItem(ACTIVE_APP_STORAGE_KEY);
        if (!raw) return '';
        const parsed = JSON.parse(raw);
        if (!parsed || !parsed.url) return '';
        if (expectedSlug && parsed.slug && parsed.slug !== expectedSlug) {
          return '';
        }
        return isValidPlanrapikuAppUrl(parsed.url);
      } catch (error) {
        return '';
      }
    }

    function clearActiveApp() {
      activeAppUrl = '';
      try {
        sessionStorage.removeItem(ACTIVE_APP_STORAGE_KEY);
      } catch (error) {}
    }

    function formatSlugLabel(slug) {
      if (!slug) return 'Modul Planrapiku';
      return String(slug)
        .split('-')
        .filter(Boolean)
        .map(function(word) {
          return word.charAt(0).toUpperCase() + word.slice(1);
        })
        .join(' ');
    }

    function hideWrapperProductFallback() {
      wpfEl.classList.remove('active');
    }

    function showWrapperProductFallback(slug) {
      const label = formatSlugLabel(slug);
      wpfHeaderTitle.textContent = label;
      wpfTitle.textContent = label;
      wpfDesc.textContent =
        'Halaman detail untuk modul "' +
        label +
        '" siap dibuka melalui portal Planrapiku.';
      wpfEl.classList.add('active');
    }

    function navigateWrapperToPage(targetPage) {
      hideWrapperProductFallback();
      const params = new URLSearchParams();
      params.set('page', targetPage);
      try {
        history.pushState(
          null,
          '',
          location.pathname + '?page=' + encodeURIComponent(targetPage)
        );
      } catch (error) {}
      loadPage(params);
    }

    wpfBackBtn.addEventListener('click', function() {
      navigateWrapperToPage('catalog');
    });
    wpfCatalogBtn.addEventListener('click', function() {
      navigateWrapperToPage('catalog');
    });
    wpfLoginBtn.addEventListener('click', function() {
      navigateWrapperToPage('login');
    });

    // Pesan loading berdasarkan halaman
    function getLoadingMessage(page) {
      const messages = {
        catalog: 'Menyiapkan katalog produk...',
        product: 'Membuka detail produk...',
        login: 'Menyiapkan halaman login...',
        member: 'Membuka member portal...',
        admin: 'Menyiapkan admin panel...',
        app: 'Membuka aplikasi produk...'
      };

      return messages[page] || 'Menyiapkan portal...';
    }

    // Menampilkan loading
    function showLoading(page) {
      clearTimeout(loadingTimer);

      loadingStartedAt = Date.now();
      loadingMessage.textContent = getLoadingMessage(page);
      loadingScreen.classList.remove('hidden');

      loadingTimer = setTimeout(function() {
        loadingMessage.textContent = 'Halaman masih sedang disiapkan...';
      }, 10000);
    }

    // Menyembunyikan loading setelah iframe selesai
    function hideLoading() {
      clearTimeout(loadingTimer);

      const elapsed = Date.now() - loadingStartedAt;
      const remaining = Math.max(0, 350 - elapsed);

      setTimeout(function() {
        loadingScreen.classList.add('hidden');
      }, remaining);
    }

    // Membaca parameter URL GitHub
    function getRouteParams() {
      const current = new URLSearchParams(location.search);
      const params = new URLSearchParams();

      let page = current.get('page') || 'catalog';

      if (!ALLOWED_PAGES.includes(page)) {
        page = 'catalog';
      }

      params.set('page', page);

      if (page === 'product' || page === 'app') {
        const slug = current.get('slug') || '';
        if (slug) {
          params.set('slug', slug.slice(0, 120));
        }
      }

      return params;
    }

    // Memuat halaman Portal atau aplikasi produk
    function loadPage(params) {
      const page = params.get('page') || 'catalog';
      hideWrapperProductFallback();

      // Jika halaman yang diminta adalah aplikasi produk
      if (page === 'app') {
        const slugParam = params.get('slug') || '';
        const resolvedUrl = activeAppUrl || readActiveApp(slugParam);

        if (!resolvedUrl) {
          clearActiveApp();
          const fallback = new URLSearchParams();
          fallback.set('page', 'catalog');

          try {
            history.replaceState(
              null,
              '',
              location.pathname + '?page=catalog'
            );
          } catch (error) {}

          loadPage(fallback);
          return;
        }

        activeAppUrl = resolvedUrl;
        saveActiveApp(slugParam, activeAppUrl);
        showLoading('app');

        // Sembunyikan Portal, tampilkan Product Viewer
        frame.style.display = 'none';
        productView.classList.add('active');

        const titleSlug = slugParam || 'Planrapiku';
        productTitle.textContent = formatSlugLabel(titleSlug);

        if (productFrame.src !== activeAppUrl) {
          productFrame.src = activeAppUrl;
        } else {
          hideLoading();
        }

        return;
      }

      // Untuk halaman Portal biasa
      clearActiveApp();
      productView.classList.remove('active');
      productFrame.src = 'about:blank';
      frame.style.display = 'block';

      showLoading(page);

      const url = new URL(EXEC_URL);
      params.forEach(function(value, key) {
        url.searchParams.set(key, value);
      });

      frame.src = url.toString();
    }

    // Ketika iframe Portal selesai dimuat
    frame.addEventListener('load', function() {
      if (frame.style.display !== 'none') {
        hideLoading();
      }
    });

    // Ketika iframe aplikasi produk selesai dimuat
    productFrame.addEventListener('load', function() {
      if (productView.classList.contains('active')) {
        hideLoading();
      }
    });

    // Membuka halaman berdasarkan URL awal
    loadPage(getRouteParams());

    // Navigasi browser Back dan Forward
    window.addEventListener('popstate', function() {
      loadPage(getRouteParams());
    });

    // Tombol kembali dari aplikasi produk ke Portal
    backToPortal.addEventListener('click', function() {
      clearActiveApp();
      navigateWrapperToPage('catalog');
    });

    // Menerima perintah navigasi dari Apps Script
    window.addEventListener('message', function(event) {
      const data = event.data;
      if (!data || data.type !== 'navigate') return;

      // Validasi asal origin (mengizinkan domain Google Apps Script / usercontent)
      let isAllowedOrigin = false;
      try {
        const originUrl = new URL(event.origin || '');
        const host = originUrl.hostname.toLowerCase();
        isAllowedOrigin =
          host === 'googleusercontent.com' ||
          host.endsWith('.googleusercontent.com') ||
          host === 'script.google.com' ||
          host.endsWith('.script.google.com');
      } catch (error) {
        isAllowedOrigin = false;
      }

      if (!isAllowedOrigin) return;
      if (!ALLOWED_PAGES.includes(data.page)) return;

      const params = new URLSearchParams();
      params.set('page', data.page);

      const slug = (data.page === 'product' || data.page === 'app') && data.slug
        ? String(data.slug).slice(0, 120)
        : '';

      if (slug) {
        params.set('slug', slug);
      }

      if (data.page === 'app') {
        const validatedAppUrl = isValidPlanrapikuAppUrl(data.appUrl);
        if (!validatedAppUrl) return;
        activeAppUrl = validatedAppUrl;
        saveActiveApp(slug, activeAppUrl);
      } else {
        clearActiveApp();
      }

      // Tampilkan loading segera agar transisi (termasuk logout) terasa responsif
      showLoading(data.page);

      try {
        history.pushState(
          null,
          '',
          location.pathname + '?' + params.toString()
        );
      } catch (error) {}

      loadPage(params);
    });

    // =====================================
    // PLANRAPIKU PWA - SERVICE WORKER
    // =====================================

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async function() {
        try {
          const registration =
            await navigator.serviceWorker.register("./sw.js");

          console.log(
            "Planrapiku Service Worker aktif:",
            registration.scope
          );
        } catch (error) {
          console.error(
            "Planrapiku Service Worker gagal:",
            error
          );
        }
      });
    }

    // =====================================
    // PLANRAPIKU - INSTALL APP
    // =====================================

    let deferredInstallPrompt = null;

    const installButton =
      document.getElementById("installAppButton");

    function isAppInstalled() {
      return (
        window.matchMedia(
          "(display-mode: standalone)"
        ).matches ||
        window.navigator.standalone === true
      );
    }

    if (isAppInstalled()) {
      installButton.classList.remove("visible");
    }

    window.addEventListener(
      "beforeinstallprompt",
      function(event) {
        event.preventDefault();
        deferredInstallPrompt = event;

        if (!isAppInstalled()) {
          installButton.classList.add("visible");
        }
      }
    );

    installButton.addEventListener(
      "click",
      async function() {
        if (!deferredInstallPrompt) return;

        deferredInstallPrompt.prompt();

        const choice =
          await deferredInstallPrompt.userChoice;

        console.log(
          "Pilihan instalasi:",
          choice.outcome
        );

        deferredInstallPrompt = null;
        installButton.classList.remove("visible");
      }
    );

    window.addEventListener(
      "appinstalled",
      function() {
        installButton.classList.remove("visible");
        deferredInstallPrompt = null;

        console.log(
          "Planrapiku berhasil diinstal!"
        );
      }
    );
  </script>

</body>
</html>
